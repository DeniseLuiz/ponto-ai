version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pontoai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pontoai
      POSTGRES_PASSWORD: pontoai_pass
      POSTGRES_DB: pontoai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontoai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pontoai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: pontoai_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    container_name: pontoai_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - redis
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2

  frontend:
    image: nginx:alpine
    container_name: pontoai_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata:
