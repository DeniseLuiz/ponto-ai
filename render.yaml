services:
  - type: web
    name: pontoai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: ./start-api.sh
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-pro
      - key: FILE_TTL_SECONDS
        value: "86400"
      - key: MAX_PDF_PAGES
        value: "5000"
      - key: PDF_CHUNK_SIZE
        value: "50"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: pontoai-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: pontoai-redis
          property: connectionString

  - type: worker
    name: pontoai-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    plan: starter
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-pro
      - key: FILE_TTL_SECONDS
        value: "86400"
      - key: MAX_PDF_PAGES
        value: "5000"
      - key: PDF_CHUNK_SIZE
        value: "50"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: pontoai-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: pontoai-redis
          property: connectionString

  - type: web
    name: pontoai-frontend
    runtime: static
    buildCommand: "echo 'no build step needed'"
    staticPublishPath: ./frontend

  - type: redis
    name: pontoai-redis
    plan: starter
    region: oregon
    ipAllowList: []
